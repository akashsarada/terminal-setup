## Visual Settings                                                    # ~
set -g default-terminal "xterm-256color"                              # o Color
set -as terminal-overrides ',xterm-256color:Tc'                       # o True color support
set -g allow-passthrough on                                           # o OSC 52 clipboard over SSH
set-environment -g LANG en_US.UTF-8                                   # o UTF-8 for icons
set-environment -g LC_ALL en_US.UTF-8                                 # |
setw -g clock-mode-colour colour81                                    # o Clock Mode Colors
setw -g window-status-current-style 'fg=black bg=colour81'           # o Active window tab
setw -g window-status-current-format ' #I #W #F '                    # |
setw -g window-status-style 'fg=colour141 bg=black'                  # o Inactive window tabs
setw -g window-status-format ' #I #[fg=gray]#W #[fg=colour141]#F ' # |
setw -g window-status-bell-style 'fg=colour141 bg=black'             # o Window Bell
set -g message-style 'fg=colour141 bg=black'                         # o Message Styles
setw -g mode-style 'fg=black bg=colour81'                            # o Copy mode styles
set -g pane-border-style 'fg=colour238'                              # o Inactive pane border (dark gray)
set -g pane-active-border-style 'fg=colour81'                        # o Active pane border (blue)
set -g display-panes-active-colour colour81                          # o Active pane number (blue)
set -g display-panes-colour colour141                                # o Inactive pane numbers (purple)
                                                                      # ~
## Status Bar                                                         # ~
set -g status-position bottom                                         # o Tmux bar top or bottom?
set -g status-justify left                                            # o Justify windows left
set -g status-style 'fg=colour81'                                    # o Status bar foreground
set -g status-left '#[bg=colour141 fg=black] § #S #[bg=default] '   # o Session name (secondary color)
set -g status-left-length 30                                          # |
set -g status-right-style 'fg=black bg=colour141'                    # o Date/time (secondary color)
set -g status-right ' %b %d, %Y | %H:%M '                           # |
set -g status-right-length 50                                         # |
                                                                      # ~
## Disable the bell                                                   # ~
set -g visual-activity off                                            # o Disable all bell notifications
set -g visual-bell off                                                # |
set -g visual-silence off                                             # |
setw -g monitor-activity off                                          # |
set -g bell-action none                                               # |
                                                                      # ~
## Usability options                                                  # ~
set -g mouse on                                                       # o Allow using the mouse
set -g allow-rename off                                               # o Don't automatically rename windows
                                                                      # ~
## Keybinds                                                           # ~
setw -g mode-keys vi                                                  # o VI mode for Copy Mode
set -g status-keys vi                                                 # o VI mode for command prompt
bind h select-pane -L                                                 # o Vim-style pane navigation
bind j select-pane -D                                                 # |
bind k select-pane -U                                                 # |
bind l select-pane -R                                                 # |

# Split panes: v = vertical (side by side), s = horizontal (top/bottom)
bind v split-window -v -c "#{pane_current_path}"
bind s split-window -h -c "#{pane_current_path}"

# Copy mode, new window, next window
bind c copy-mode
bind n new-window -c "#{pane_current_path}"
bind o next-window

# Resize panes with arrow keys (-r = repeatable)
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 3
bind -r Down resize-pane -D 3

# Previous window (pairs with o = next)
bind i previous-window

if-shell '[ "$(tmux display-message -p "#S")" = "default" ]' \
  "split-window -h"

# Reduce the repeat/escape delay
set -s escape-time 1

# Optional: faster redraw (makes cursor feel more responsive)
set -s repeat-time 100

# Allow copying to system clipboard
set-option -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Y send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi u send-keys -X begin-selection \; send-keys -X end-of-line \; send-keys -X copy-pipe-and-cancel "pbcopy"
