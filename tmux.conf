## Visual Settings                                                    # ~
set -g default-terminal "screen-256color"                             # o Color
setw -g clock-mode-colour colour74                                  # o Clock Mode Colors
setw -g window-status-current-style 'fg=colour245 bg=colour74'             # o What is rendered for each window
setw -g window-status-current-format ' #I #W #F '                     # |
setw -g window-status-style 'fg=colour74 bg=colour245'                     # o What is rendered for unactive windows
setw -g window-status-format ' #I #[fg=gray]#W #[fg=colour74]#F '      # |
setw -g window-status-bell-style 'fg=colour74 bg=black'                # o Window Bell?
set -g message-style 'fg=red bg=black'                                # o Message Styles
setw -g mode-style 'fg=black bg=colour74'                              # o Copy mode styles
set -g pane-border-style 'fg=colour74'                                 # o Pane Styles
set -g pane-active-border-style 'fg=colour74'                          # |
																																			# ~
## Status Bar																													# ~
set -g status-position bottom       																	# o Tmux bar top or bottom?
set -g status-justify left       																			# o Set where on the screen the new windows are justified to
set -g status-style 'fg=colour74'																			# o Idk.
set -g status-left '#[bg=colour245 fg=black] § #S #[bg=default] '				# o Configure general settings for left side (current session)
set -g status-left-length 30																					# |
set -g status-right-style 'fg=black bg=colour245'												# o Configure settings for date and time
set -g status-right ' %b %d, %Y | %H:%M '															# |
set -g status-right-length 50																					# |
																																			# ~
## Disable the bell																										# ~
set -g visual-activity off																						# o Disable all the annoying bell thingys 
set -g visual-bell off																								# |
set -g visual-silence off																							# |
setw -g monitor-activity off																					# |
set -g bell-action none																								# |
																																			# ~
## Usability options																									# ~
set -g mouse on																												# o Allow using the mouse
set -g allow-rename off                                               # o Don't automatically rename windows 
																																			# ~
## Keybinds																														# ~
setw -g mode-keys vi																									# o VI mode for Copy Mode
set -g status-keys vi																									# o idk.
bind h select-pane -L																									# o Enable vim like key movement
bind j select-pane -D																									# |
bind k select-pane -U																									# | 
bind l select-pane -R																									# |

# Split panes vertically using % (Shift + 5)
bind % split-window -h -c "#{pane_current_path}"

# Split panes horizontally using " (Shift + ')
bind '"' split-window -v -c "#{pane_current_path}"

# Also useful: Open new windows in the same directory
bind c new-window -c "#{pane_current_path}"

if-shell '[ "$(tmux display-message -p "#S")" = "default" ]' \
  "split-window -h"

# Reduce the repeat/escape delay
set -s escape-time 1

# Optional: faster redraw (makes cursor feel more responsive)
set -s repeat-time 100

# Allow copying to system clipboard
set-option -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
